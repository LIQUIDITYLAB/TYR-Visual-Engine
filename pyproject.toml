[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyr-visual-engine"
version = "0.1.0"
description = "Deterministic, headless video generation engine: structured scene files in, MP4 out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tyr = "tyr.cli:main"

[project.urls]
Homepage = "https://github.com/wendywhittle/TYR-Visual-Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
