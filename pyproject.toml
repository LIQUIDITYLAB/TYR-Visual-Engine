[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyr-visual-engine"
version = "0.1.0"
description = "Deterministic programmable video generation engine."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
